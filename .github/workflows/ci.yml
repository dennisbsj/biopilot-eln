name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - name: Verify API without Postgres
        run: |
          DATABASE_URL="" PORT=3011 npm run start:api > api.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in {1..20}; do
            health=$(curl -fsS http://127.0.0.1:3011/health 2>/dev/null || true)
            if echo "$health" | grep -q '"database":false'; then
              experiments=$(curl -fsS 'http://127.0.0.1:3011/api/experiments?q=test')
              test "$experiments" = "[]"
              exit 0
            fi
            sleep 0.5
          done
          cat api.log
          exit 1
      - run: npm audit --omit=dev --audit-level=high
